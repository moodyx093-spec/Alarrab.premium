  :root{
    --orange:#F36F14;
    --orange-deep:#DD600B;
    --black:#0E0E0E;
    --white:#FFFFFF;
    --ink-soft:rgba(14,14,14,.78);
    --line:#0E0E0E;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  html{background:var(--orange);}
  body{
    background:var(--orange);
    color:var(--black);
    font-family:'Alexandria',system-ui,sans-serif;
    min-height:100vh;
    -webkit-text-size-adjust:100%;
  }
  .page{
    width:100%; max-width:480px; min-height:100vh; margin:0 auto;
    background:var(--orange);
    display:flex; flex-direction:column;
  }
  .sr{ position:absolute; width:1px; height:1px; margin:-1px; padding:0; overflow:hidden; clip:rect(0,0,0,0); white-space:nowrap; border:0; }

  .lang-toggle{
    position:fixed; top:calc(16px + env(safe-area-inset-top,0px)); right:16px; z-index:10;
    font:700 13px/1 inherit; font-family:inherit;
    color:var(--orange); background:var(--black);
    border:0; border-radius:20px; padding:9px 16px; cursor:pointer;
    transition:background .15s ease,color .15s ease;
  }
  .lang-toggle:hover{ background:var(--white); color:var(--black); }

  .hero{ padding:calc(64px + env(safe-area-inset-top,0px)) 28px 34px; text-align:center; display:flex; flex-direction:column; align-items:center; }
  .logo{ width:min(230px,60%); height:auto; display:block; margin:0 auto 18px; }
  .subtitle{ margin:0 0 4px; font-size:16px; font-weight:800; color:var(--black); }
  .tagline{ margin:0; font-size:14px; font-weight:600; color:var(--ink-soft); }
  html[lang="ar"] .subtitle,
  html[lang="ar"] .tagline{ font-family:'Alexandria',sans-serif; }
  html[lang="en"] .subtitle,
  html[lang="en"] .tagline,
  html[lang="en"] .btn,
  html[lang="en"] .footnote,
  html[lang="en"] .follow{ font-family:'Alexandria',system-ui,sans-serif; }
  html[lang="en"] .subtitle{ letter-spacing:3px; text-transform:uppercase; font-size:14px; }

  .stripe{ height:8px; background:var(--black); flex:0 0 auto; }

  .panel{ background:var(--orange-deep); padding:22px 18px; }
  .panel-in{ border:2px dashed var(--black); border-radius:22px; padding:18px; }
  .actions{ display:flex; flex-direction:column; gap:12px; }
  .btn{
    display:flex; align-items:center; justify-content:center; gap:10px;
    padding:15px 20px; border-radius:16px; font-family:inherit; font-size:16px; font-weight:800;
    text-decoration:none; color:var(--black); background:transparent;
    border:2px solid var(--black);
    transition:transform .15s ease,background .15s ease,color .15s ease;
  }
  .btn:hover{ background:var(--black); color:var(--orange); }
  .btn:active{ transform:scale(.98); }
  .btn svg{ flex-shrink:0; }
  .btn.primary{
    background:var(--black); color:var(--white); font-weight:900; font-size:18px; padding:18px 20px;
    box-shadow:0 10px 24px rgba(0,0,0,.28);
  }
  .btn.primary:hover{ background:var(--white); color:var(--black); border-color:var(--white); }
  html[lang="ar"] .btn{ font-family:'Alexandria',sans-serif; }

  .foot{
    background:var(--orange); color:var(--black); text-align:center;
    padding:26px 20px calc(30px + env(safe-area-inset-bottom,0px)); flex:1 0 auto;
  }
  .follow{ font-size:14px; font-weight:800; margin:0 0 14px; }
  .social{ display:flex; justify-content:center; gap:14px; }
  .social a{
    width:48px; height:48px; border-radius:50%; background:var(--black); color:var(--orange);
    display:flex; align-items:center; justify-content:center; text-decoration:none;
    transition:background .15s ease,color .15s ease;
  }
  .social a:hover{ background:var(--white); color:var(--black); }
  .footnote{ margin:22px 0 0; font-size:15px; font-weight:800; letter-spacing:1px; color:var(--black); }
  a:focus-visible, button:focus-visible, input:focus-visible{ outline:3px solid var(--black); outline-offset:3px; }
  .btn.primary:focus-visible{ outline-color:var(--white); }

  @media (prefers-reduced-motion: reduce){ .btn,.social a,.lang-toggle{ transition:none; } }

  /* ===== المينيو الإلكتروني ===== */
  .menu-viewer{ position:fixed; inset:0; z-index:100; background:var(--orange); display:none; flex-direction:column; }
  .menu-viewer.open{ display:flex; }
  .menu-bar{
    flex:0 0 auto; display:flex; align-items:center; justify-content:space-between; gap:12px;
    padding:calc(10px + env(safe-area-inset-top,0px)) 16px 10px; background:var(--black); color:var(--orange);
  }
  .menu-bar h2{ margin:0; font-size:18px; font-weight:900; flex:1; color:var(--orange); }
  .menu-close{
    width:40px; height:40px; flex-shrink:0; display:flex; align-items:center; justify-content:center;
    color:var(--black); border:0; background:var(--orange); border-radius:50%; cursor:pointer;
    transition:background .15s ease,color .15s ease;
  }
  .menu-close:hover{ background:var(--white); }
  .mn-head{ flex:0 0 auto; background:var(--orange); border-bottom:3px solid var(--black); padding-top:10px; }
  #mnSearch{
    display:block; width:calc(100% - 28px); margin:0 14px 10px; border:2px solid var(--black);
    background:rgba(255,255,255,.28); color:var(--black); border-radius:20px; padding:10px 16px;
    font:inherit; font-size:14px; outline:0;
  }
  #mnSearch:focus{ background:rgba(255,255,255,.45); }
  #mnSearch::placeholder{ color:var(--ink-soft); }
  #mnNav{ display:flex; gap:8px; overflow-x:auto; padding:2px 14px 12px; scrollbar-width:none; }
  #mnNav::-webkit-scrollbar{ display:none; }
  #mnNav button{
    flex:none; border:2px solid var(--black); background:transparent; color:var(--black);
    border-radius:20px; padding:6px 14px; font:800 14px Alexandria,sans-serif; cursor:pointer;
  }
  #mnNav button.on{ background:var(--black); color:var(--orange); }
  .menu-scroll{ flex:1 1 auto; overflow-y:auto; -webkit-overflow-scrolling:touch; padding:0 14px calc(28px + env(safe-area-inset-bottom,0px)); }
  #mnMain{ max-width:720px; margin:0 auto; }
  #mnMain h3{
    margin:26px 0 6px; padding-bottom:8px; font-size:21px; color:var(--black); font-weight:900;
    border-bottom:3px solid var(--black);
  }
  .mn-note{ color:var(--ink-soft); font-size:12.5px; margin:8px 0 4px; }
  .mn-item{ display:flex; align-items:center; gap:10px; background:var(--orange-deep); border:2px solid var(--black); border-radius:16px; padding:12px 14px; margin-top:8px; }
  .mn-info{ flex:1; min-width:0; text-align:center; }
  .mn-nm{ font-weight:800; font-size:15.5px; color:var(--black); }
  .mn-ds{ color:var(--ink-soft); font-size:12.5px; line-height:1.5; }
  .mn-pr{ flex:none; align-self:center; color:var(--orange); font-weight:900; font-size:14px; white-space:nowrap; background:var(--black); border-radius:12px; padding:7px 11px; direction:rtl; }
  .mn-ask{ font-size:12px; color:var(--orange); font-weight:700; }
  .mn-empty{ text-align:center; color:var(--black); padding:30px 0; font-weight:700; }

  .sizes{ display:inline-flex; margin-top:8px; border:2px solid var(--black); border-radius:20px; overflow:hidden; }
  .sizes .sz{ border:0; background:transparent; color:var(--black); font:800 13px Alexandria,sans-serif; padding:5px 16px; cursor:pointer; min-width:64px; }
  .sizes .sz + .sz{ border-inline-start:2px solid var(--black); }
  .sizes .sz.on{ background:var(--black); color:var(--orange); }
  .mn-pr{ min-width:76px; text-align:center; }

  /* أزرار سوداء مطفية بنص أبيض */
  .btn, .btn.primary{ background:#141414; color:#FFFFFF; border:0; box-shadow:none; }
  .btn:hover, .btn.primary:hover{ background:#2B2B2B; color:#FFFFFF; border:0; }
  .btn.primary{ font-weight:900; }
  .lang-toggle{ background:#141414; color:#FFFFFF; }
  .lang-toggle:hover{ background:#2B2B2B; color:#FFFFFF; }
  .btn:focus-visible, .btn.primary:focus-visible{ outline:3px solid #FFFFFF; outline-offset:2px; }

  /* ===== صفحة خلفية + بطاقة عائمة ===== */
  html{ background:#6E2A05; }

  /* ===== أيتمز المينيو بالأسود المطفي + خلفية القائمة ===== */
  .menu-viewer, .mn-head{ background:var(--orange); }
  .mn-item{ background:#141414; border:0; }
  .mn-nm{ color:#FFFFFF; }
  .mn-ds{ color:rgba(255,255,255,.72); }
  .mn-pr{ background:#FFFFFF; color:#141414; }
  .mn-ask{ color:#141414; }
  .sizes{ border-color:rgba(255,255,255,.55); }
  .sizes .sz{ color:#FFFFFF; }
  .sizes .sz + .sz{ border-inline-start-color:rgba(255,255,255,.55); }
  .sizes .sz.on{ background:var(--orange); color:#141414; }
  #mnMain h3{ text-align:center; }

  /* ===== خيار الحجم: أزرار منفصلة بشكل راديو ===== */
  .sizes{ display:flex; justify-content:center; gap:8px; margin-top:10px; border:0; border-radius:0; overflow:visible; }
  .sizes .sz, .sizes .sz + .sz{
    display:inline-flex; align-items:center; gap:7px; min-width:0; padding:6px 14px 6px 12px;
    border:1.5px solid rgba(255,255,255,.35); border-radius:999px; background:rgba(255,255,255,.06);
    color:rgba(255,255,255,.8); font:700 13px Alexandria,sans-serif; transition:background .15s ease,border-color .15s ease,color .15s ease;
  }
  .sizes .sz::before{ content:""; width:12px; height:12px; flex:none; border-radius:50%; border:2px solid currentColor; box-sizing:border-box; }
  .sizes .sz.on, .sizes .sz.on + .sz, .sizes .sz + .sz.on{ }
  .sizes .sz.on{ background:rgba(243,111,20,.16); border-color:var(--orange); color:var(--orange); }
  .sizes .sz.on::before{ background:var(--orange); box-shadow:inset 0 0 0 2px #141414; }

  /* الاسم على اليمين والأحجام بجانبه (جنباً إلى جنب) */
  .mn-info.row{ display:flex; align-items:center; gap:8px; text-align:start; }
  .mn-info.row .mn-nm{ flex:1; min-width:0; text-align:start; }
  .mn-info.row .sizes{ flex:none; flex-direction:row; gap:5px; margin-top:0; justify-content:center; }
  .mn-info.row .sizes .sz, .mn-info.row .sizes .sz + .sz{ width:auto; justify-content:center; gap:5px; padding:5px 9px 5px 7px; font-size:12px; }
  .mn-info.row .sizes .sz::before{ width:10px; height:10px; }

  /* أزرار الحجم: مستطيلات صغيرة بدون دائرة */
  .mn-info.row .sizes .sz::before, .sizes .sz::before{ display:none; content:none; }
  .mn-info.row .sizes{ gap:6px; }
  .mn-info.row .sizes .sz, .mn-info.row .sizes .sz + .sz, .sizes .sz, .sizes .sz + .sz{
    min-width:38px; width:auto; padding:6px 11px; gap:0; justify-content:center;
    border:0; border-radius:12px; background:rgba(255,255,255,.14); color:#FFFFFF;
    font:900 14px Alexandria,sans-serif;
  }
  .mn-info.row .sizes .sz.on, .sizes .sz.on{ background:var(--orange); color:#141414; border:0; }

  /* رسومات كوفي هاوس بيضاء تحت خط الأقسام فقط */

  /* ===== المينيو الإنجليزي: خط الأيتمز + خط عناوين الأقسام ===== */
  html[lang="en"] .mn-nm{ font-family:'Poppins',sans-serif; font-weight:500; font-size:15px; letter-spacing:.2px; }
  html[lang="en"] .mn-ds{ font-family:'Poppins',sans-serif; font-weight:400; }
  html[lang="en"] .mn-pr, html[lang="en"] .mn-ask{ font-family:'Poppins',sans-serif; font-weight:600; }
  html[lang="en"] #mnMain h3{ font-family:'Yellowtail','Alexandria',cursive; font-weight:400; font-size:32px; letter-spacing:.5px; }

  /* ===== المينيو العربي: خط الأيتمز + خط عناوين الأقسام ===== */
  html[lang="ar"] .mn-nm{ font-family:'Readex Pro','Alexandria',sans-serif; font-weight:500; font-size:15px; }
  html[lang="ar"] .mn-ds{ font-family:'Readex Pro','Alexandria',sans-serif; font-weight:400; }
  html[lang="ar"] .mn-pr, html[lang="ar"] .mn-ask{ font-family:'Readex Pro','Alexandria',sans-serif; font-weight:600; }
  html[lang="ar"] #mnMain h3{ font-family:'Aref Ruqaa','Alexandria',serif; font-weight:700; font-size:30px; }

  /* لوجو العراب الأبيض أعلى القائمة */
  .menu-logo{ flex:0 0 auto; background:var(--orange); display:flex; justify-content:center; align-items:center; padding:calc(10px + env(safe-area-inset-top,0px)) 16px 8px; }
  .menu-logo img{ height:42px; width:auto; display:block; }
  .menu-bar{ padding-top:10px; }

  /* ===== توحيد الخطوط في كل الصفحات ===== */
  html[lang="ar"] body, html[lang="ar"] .btn, html[lang="ar"] .follow, html[lang="ar"] .footnote,
  html[lang="ar"] .lang-toggle, html[lang="ar"] #mnSearch, html[lang="ar"] #mnNav button,
  html[lang="ar"] .mn-note, html[lang="ar"] .mn-empty{ font-family:'Readex Pro','Alexandria',sans-serif; }
  html[lang="en"] body, html[lang="en"] .btn, html[lang="en"] .follow, html[lang="en"] .footnote,
  html[lang="en"] .lang-toggle, html[lang="en"] #mnSearch, html[lang="en"] #mnNav button,
  html[lang="en"] .mn-note, html[lang="en"] .mn-empty{ font-family:'Poppins',sans-serif; }
  html[lang="ar"] .btn, html[lang="ar"] #mnNav button{ font-weight:600; }
  html[lang="en"] .btn, html[lang="en"] #mnNav button{ font-weight:500; }
  /* العناوين بالخط اليدوي */
  html[lang="ar"] .tagline, html[lang="ar"] .menu-bar h2{ font-family:'Aref Ruqaa','Alexandria',serif; font-weight:700; font-size:24px; line-height:1.4; }
  html[lang="en"] .tagline, html[lang="en"] .menu-bar h2{ font-family:'Yellowtail','Alexandria',cursive; font-weight:400; font-size:28px; line-height:1.3; letter-spacing:.5px; }

  /* ===== توحيد محاذاة الأزرار: أيقونة في خانة ثابتة + نص في المنتصف ===== */
  .actions .btn, .actions .btn.primary{
    display:grid; grid-template-columns:24px 1fr 24px; align-items:center; column-gap:10px;
    height:56px; min-height:56px; padding:0 18px; box-sizing:border-box;
    font-size:15.5px; line-height:1.2;
  }
  .actions .btn::after{ content:""; grid-column:3; }
  .actions .btn svg{ grid-column:1; width:22px; height:22px; justify-self:center; }
  .actions .btn span{ grid-column:2; text-align:center; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
</style>

<script>
  const translations = {
    ar: {
      title: "العراب PREMIUM",
      sub: "",
      tagline: "أهلاً بكم في العراب",
      menu: "قائمة المشروبات والحلويات",
      call: "اتصل بنا",
      location: "موقعنا على الخريطة",
      review: "قيّمنا على جوجل",
      follow: "تابعنا",
      footnote: "العراب PREMIUM",
      toggleLabel: "English",
      search: "ابحث في المينيو...",
      logoAlt: "شعار العراب بريميوم",
      pageAlt: "قائمة العراب – صفحة",
      page: "صفحة",
      of: "من",
      close: "إغلاق",
      docTitle: "العراب PREMIUM",
      dir: "rtl",
      lang: "ar"
    },
    en: {
      title: "Al Arrab PREMIUM",
      sub: "",
      tagline: "Welcome to Al Arrab",
      menu: "Drinks & Desserts Menu",
      call: "Call Us",
      location: "Our Location",
      review: "Rate Us on Google",
      follow: "Follow Us",
      footnote: "AL ARRAB PREMIUM",
      toggleLabel: "عربي",
      search: "Search the menu...",
      logoAlt: "Al Arrab Premium logo",
      pageAlt: "Al Arrab menu – page",
      page: "Page",
      of: "of",
      close: "Close",
      docTitle: "Al Arrab PREMIUM",
      dir: "ltr",
      lang: "en"
    }
  };

  let currentLang = "ar";

  function setText(id, value){ document.getElementById(id).textContent = value; }

  function applyLang(lang){
    const t = translations[lang];
    setText("txt-title", t.title);
    setText("txt-sub", t.sub);
    setText("txt-tagline", t.tagline);
    setText("txt-menu", t.menu);
    setText("txt-call", t.call);
    setText("txt-location", t.location);
    setText("txt-review", t.review);
    setText("txt-follow", t.follow);
    setText("txt-footnote", t.footnote);
    setText("langToggle", t.toggleLabel);
    setText("menuHeaderTitle", t.menu);
    document.getElementById("menuClose").setAttribute("aria-label", t.close);
    document.getElementById("logoImg").setAttribute("alt", t.logoAlt);
    document.documentElement.setAttribute("dir", t.dir);
    document.documentElement.setAttribute("lang", t.lang);
    document.title = t.docTitle;
    mnSearch.placeholder = t.search;
    currentLang = lang;
    MENU_LANG = lang;
    buildNav();
    renderMenu();
  }

  function toggleLang(){ applyLang(currentLang === "ar" ? "en" : "ar"); }

  /* ===== المينيو الإلكتروني ===== */
  const menuViewer = document.getElementById("menuViewer");
  const menuScroll = document.getElementById("menuScroll");
  const mnMain = document.getElementById("mnMain");
  const mnNav = document.getElementById("mnNav");
  const mnSearch = document.getElementById("mnSearch");
  let menuPushed = false;
  let curTab = "";
  const fmt = n => n.toFixed(2) + " " + tr(CUR);

  function renderMenu(){
    const term = mnSearch.value.trim();
    const tl = term.toLowerCase();
    let h = "";
    MENU.forEach(c => {
      const its = c.items.filter(it => !term || it[0].includes(term) || c.n.includes(term) || (EN[it[0]]||'').toLowerCase().includes(tl) || (EN[c.n]||'').toLowerCase().includes(tl));
      if(!its.length) return;
      h += `<section id="mn-${c.id}"><h3>${tr(c.n)}</h3>`;
      its.forEach(it => {
        const o = it[3];
        const nm = `<div class="mn-nm">${tr(it[0])}</div>`;
        const ds = it[2] ? `<div class="mn-ds">${tr(it[2])}</div>` : "";
        if(o){
          const sz = o.map((x,k) => `<button type="button" class="sz${k?'':' on'}" data-p="${fmt(x[1])}">${tr(x[0])}</button>`).join("");
          h += `<div class="mn-item"><div class="mn-info row">${nm}${ds}<div class="sizes" role="group">${sz}</div></div><div class="mn-pr">${fmt(o[0][1])}</div></div>`;
        } else {
          h += `<div class="mn-item"><div class="mn-info">${nm}${ds}</div><div class="mn-pr">${it[1]==null?`<span class="mn-ask">${tr('اسأل النادل')}</span>`:fmt(it[1])}</div></div>`;
        }
      });
      h += "</section>";
    });
    mnMain.innerHTML = h || `<div class="mn-empty">${tr('لا توجد نتائج')}</div>`;
    curTab = ""; spy();
  }

  function buildNav(){ mnNav.innerHTML = MENU.map(c => `<button type="button" data-c="${c.id}">${tr(c.n)}</button>`).join(""); }
  buildNav();

  function goTo(id){
    const el = document.getElementById("mn-" + id);
    if(!el) return;
    menuScroll.scrollTo({ top: el.getBoundingClientRect().top - menuScroll.getBoundingClientRect().top + menuScroll.scrollTop - 4, behavior: "auto" });
  }

  function spy(){
    const base = menuScroll.getBoundingClientRect().top;
    let cur = null;
    MENU.forEach(c => { const el = document.getElementById("mn-" + c.id); if(el && el.getBoundingClientRect().top - base <= 30) cur = c.id; });
    if(!cur){ const f = mnMain.querySelector("section"); cur = f ? f.id.slice(3) : null; }
    if(cur === curTab) return;
    curTab = cur;
    mnNav.querySelectorAll("button").forEach(x => {
      const on = x.dataset.c === cur;
      x.classList.toggle("on", on);
      if(on) mnNav.scrollLeft += (x.getBoundingClientRect().left + x.offsetWidth/2) - (mnNav.getBoundingClientRect().left + mnNav.clientWidth/2);
    });
  }

  mnMain.addEventListener("click", e => {
    const b = e.target.closest(".sz"); if(!b) return;
    const box = b.closest(".mn-item");
    box.querySelectorAll(".sz").forEach(x => x.classList.toggle("on", x === b));
    box.querySelector(".mn-pr").textContent = b.dataset.p;
  });
  mnSearch.addEventListener("input", renderMenu);
  menuScroll.addEventListener("scroll", spy, { passive: true });
  mnNav.addEventListener("click", e => {
    const b = e.target.closest("button"); if(!b) return;
    if(mnSearch.value){ mnSearch.value = ""; renderMenu(); }
    goTo(b.dataset.c);
  });
  renderMenu();

  function openMenu(e){
    if (e) e.preventDefault();
    menuViewer.classList.add("open");
    menuViewer.setAttribute("aria-hidden", "false");
    document.body.style.overflow = "hidden";
    menuScroll.scrollTop = 0;
    curTab = ""; spy();
    try { history.pushState({ menu: true }, "", "#menu"); menuPushed = true; } catch (err) { menuPushed = false; }
    document.getElementById("menuClose").focus();
  }

  function closeMenu(fromPop){
    if (!menuViewer.classList.contains("open")) return;
    menuViewer.classList.remove("open");
    menuViewer.setAttribute("aria-hidden", "true");
    document.body.style.overflow = "";
    if (!fromPop && menuPushed){ menuPushed = false; history.back(); }
    else { menuPushed = false; }
    document.getElementById("openMenu").focus();
  }

  document.getElementById("langToggle").addEventListener("click", toggleLang);
  document.getElementById("openMenu").addEventListener("click", openMenu);
  document.getElementById("menuClose").addEventListener("click", function(){ closeMenu(false); });
  window.addEventListener("popstate", function(){ closeMenu(true); });
  document.addEventListener("keydown", function(e){ if (e.key === "Escape") closeMenu(false); });
  applyLang("ar");
</script>


</body>
</html>
